<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Violaceos Hotel CRM</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">

                <img
                    src="../assets/logo.png"
                    alt="Violaceos Hotel Logo"
                >

            </div>


            <h1>Create Account</h1>

            <p class="login-subtitle">
                Create an account for the CRM system
            </p>


            <form onsubmit="handleSignup(event)">

                <div class="form-row">

                    <div class="form-group">

                        <label for="signupFirstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="signupFirstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupLastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="signupLastName"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-block"
                >
                    Create Account
                </button>

            </form>


            <p class="account-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
