<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Violaceos Hotel CRM</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">
                <img src="../assets/logo.png" alt="Violaceos Hotel Logo">
            </div>

            <h1>Violaceos Hotel</h1>

            <p class="login-subtitle">
                CRM System
            </p>

            <form onsubmit="handleLogin(event)">

                <div class="form-group">

                    <label for="signinEmail">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="signinEmail"
                        placeholder="Enter your email or username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signinPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signinPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-block"
                >
                    Login
                </button>

            </form>


            <p class="account-link">
                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
