<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Violaceos Hotel CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">&#9776;</button>
    <div class="logo-area">
      <img src="assets/logo.png" alt="Logo">
      <div>
        <h1>Violaceos Hotel</h1>
        <span>CRM SYSTEM</span>
      </div>
    </div>
  </div>
  <div class="user-info">
    <span class="username-text">Welcome, Admin</span><a href="login.html" class="logout-link">Logout</a>
  </div>
</div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <a href="index.html" class="active">Dashboard</a>
    <a href="pages/guests.html">Guests / Customers</a>
    <a href="pages/feedback.html">Feedback</a>
    <a href="pages/loyalty.html">Loyalty Program</a>
  </div>

  <div class="main-content">
    <h2 class="page-title">Dashboard</h2>

    <div class="card-row">
      <div class="stat-card">
        <h3>Total Guests</h3>
        <p id="statTotalGuests">0</p>
      </div>
      <div class="stat-card">
        <h3>Active Guests</h3>
        <p id="statActiveGuests">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Feedback</h3>
        <p id="statFeedback">0</p>
      </div>
      <div class="stat-card">
        <h3>Average Rating</h3>
        <p id="statAvgRating">0</p>
      </div>
    </div>

    <div class="panel">
      <h2>Recently Added Guests</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Loyalty Tier</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="recentGuestsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<footer>Violaceos Hotel CRM System</footer>

<script src="js/script.js"></script>
<script>
  loadDashboard();
</script>
</body>
</html>
